#     Kaique Barros Paiva         - RA 10441787
#
# Sintese:
#     Roda a suite de testes do web/api a cada push e a cada pull request.
#     O PostgreSQL sobe como servico do proprio job, e a suite cria dentro
#     dele o banco de teste e aplica o infra/db/init/01-schema.sql, o mesmo
#     arquivo que o container de desenvolvimento usa. Nao depende de carga de
#     dados nem da API no ar: os testes de rota usam o TestClient do FastAPI.
#
# Historico de alteracoes:
#     21/10/2026 - Isabela - Criacao, junto da suite de testes do web/api.

name: Testes da API

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: pytest sobre web/api
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gabinete
          POSTGRES_PASSWORD: gabinete_ci
          POSTGRES_DB: gabinete
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabinete -d gabinete"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: gabinete
      POSTGRES_PASSWORD: gabinete_ci
      POSTGRES_DB: gabinete
      POSTGRES_DB_TESTE: gabinete_teste

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/api/requirements-dev.txt

      - name: Instalar as dependencias
        run: pip install -r web/api/requirements-dev.txt

      - name: Rodar a suite
        working-directory: web/api
        run: pytest -v
