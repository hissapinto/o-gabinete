[pytest]
# Suite da aplicacao de terminal e do pipeline. A suite da API tem a propria
# configuracao em web/api/pytest.ini, porque ela precisa de banco e esta roda
# sem nenhuma infraestrutura.
#
# Os modulos de grafos/ e pipeline/ se importam por nome simples (from
# filaCircular import ..., from utils import ...), do mesmo jeito que
# grafos/main.py monta o sys.path em tempo de execucao. As pastas abaixo
# reproduzem isso para os testes.
pythonpath = grafos/negocio grafos/persistencia grafos/apresentacao pipeline
testpaths = tests
addopts = -q --strict-markers
