<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="520" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="56" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="16" y="34" font-size="20" font-weight="bold" fill="#333333">O GABINETE</text>
  <rect x="180" y="14" width="260" height="28" fill="none" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="192" y="33" font-size="13" fill="#666666">🔎 Buscar deputado por nome...</text>

  <!-- Graph area (dimmed, node selected highlighted) -->
  <rect x="16" y="72" width="540" height="400" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="26" y="92" font-size="12" fill="#999999">ÁREA DO GRAFO (nó selecionado em destaque)</text>

  <g stroke="#cccccc" stroke-width="1">
    <line x1="140" y1="180" x2="260" y2="150"/>
    <line x1="140" y1="180" x2="200" y2="280"/>
    <line x1="260" y1="150" x2="380" y2="190"/>
    <line x1="200" y1="280" x2="360" y2="320"/>
    <line x1="380" y1="190" x2="360" y2="320"/>
  </g>
  <g fill="#eeeeee" stroke="#bbbbbb" stroke-width="1.2">
    <circle cx="140" cy="180" r="10"/>
    <circle cx="260" cy="150" r="10"/>
    <circle cx="200" cy="280" r="10"/>
  </g>
  <!-- Selected node -->
  <circle cx="380" cy="190" r="20" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <circle cx="360" cy="320" r="12" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1.2"/>

  <!-- Side drawer: deputy profile -->
  <rect x="572" y="72" width="212" height="400" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="584" y="94" font-size="9" fill="#999999">PERFIL DO DEPUTADO</text>

  <circle cx="678" cy="140" r="34" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="666" y="146" font-size="20" fill="#999999">👤</text>

  <line x1="600" y1="196" x2="756" y2="196" stroke="#333333" stroke-width="2"/>
  <text x="584" y="192" font-size="13" font-weight="bold" fill="#333333">Nome do Deputado</text>
  <text x="584" y="214" font-size="11" fill="#666666">Partido/UF — Legislatura 57</text>

  <text x="584" y="240" font-size="10" font-weight="bold" fill="#333333">Resumo de votações</text>
  <rect x="584" y="250" width="18" height="30" fill="none" stroke="#333333"/>
  <rect x="610" y="238" width="18" height="42" fill="none" stroke="#333333"/>
  <rect x="636" y="258" width="18" height="22" fill="none" stroke="#333333"/>
  <rect x="662" y="246" width="18" height="34" fill="none" stroke="#333333"/>
  <text x="584" y="296" font-size="9" fill="#999999">Sim / Não / Abstenção / Ausente</text>

  <rect x="584" y="330" width="184" height="30" fill="none" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="598" y="349" font-size="11" fill="#333333">Comparar com outro deputado</text>

  <rect x="584" y="372" width="184" height="30" fill="none" stroke="#333333" stroke-width="1.5" rx="4"/>
  <text x="610" y="391" font-size="11" fill="#333333">Ver perfil completo</text>

  <line x1="584" y1="420" x2="768" y2="420" stroke="#cccccc" stroke-width="1"/>
  <text x="584" y="438" font-size="9" fill="#999999">Últimas proposições votadas:</text>
  <line x1="584" y1="450" x2="760" y2="450" stroke="#dddddd" stroke-width="5"/>
  <line x1="584" y1="464" x2="740" y2="464" stroke="#dddddd" stroke-width="5"/>

  <line x1="0" y1="490" x2="800" y2="490" stroke="#333333" stroke-width="1"/>
  <text x="16" y="508" font-size="10" fill="#999999">Painel aberto ao clicar em um nó do grafo</text>
</svg>
