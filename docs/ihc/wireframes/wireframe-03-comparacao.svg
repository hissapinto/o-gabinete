<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="520" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="56" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="16" y="34" font-size="20" font-weight="bold" fill="#333333">O GABINETE</text>
  <text x="600" y="34" font-size="14" fill="#666666">Comparar Deputados</text>

  <!-- Deputy A card -->
  <rect x="32" y="80" width="320" height="220" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="90" cy="140" r="30" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="78" y="146" font-size="18" fill="#999999">👤</text>
  <text x="132" y="130" font-size="13" font-weight="bold" fill="#333333">Deputado A</text>
  <text x="132" y="150" font-size="11" fill="#666666">Partido/UF</text>
  <line x1="48" y1="188" x2="320" y2="188" stroke="#cccccc" stroke-width="1"/>
  <text x="48" y="208" font-size="10" fill="#999999">Total de votações: 000</text>
  <line x1="48" y1="222" x2="290" y2="222" stroke="#dddddd" stroke-width="5"/>
  <line x1="48" y1="238" x2="260" y2="238" stroke="#dddddd" stroke-width="5"/>
  <line x1="48" y1="254" x2="300" y2="254" stroke="#dddddd" stroke-width="5"/>
  <line x1="48" y1="270" x2="230" y2="270" stroke="#dddddd" stroke-width="5"/>

  <!-- Deputy B card -->
  <rect x="448" y="80" width="320" height="220" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="506" cy="140" r="30" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="494" y="146" font-size="18" fill="#999999">👤</text>
  <text x="548" y="130" font-size="13" font-weight="bold" fill="#333333">Deputado B</text>
  <text x="548" y="150" font-size="11" fill="#666666">Partido/UF</text>
  <line x1="464" y1="188" x2="736" y2="188" stroke="#cccccc" stroke-width="1"/>
  <text x="464" y="208" font-size="10" fill="#999999">Total de votações: 000</text>
  <line x1="464" y1="222" x2="706" y2="222" stroke="#dddddd" stroke-width="5"/>
  <line x1="464" y1="238" x2="676" y2="238" stroke="#dddddd" stroke-width="5"/>
  <line x1="464" y1="254" x2="716" y2="254" stroke="#dddddd" stroke-width="5"/>
  <line x1="464" y1="270" x2="646" y2="270" stroke="#dddddd" stroke-width="5"/>

  <!-- Similarity badge -->
  <circle cx="400" cy="190" r="46" fill="#ffffff" stroke="#333333" stroke-width="2.5"/>
  <text x="378" y="185" font-size="22" font-weight="bold" fill="#333333">72%</text>
  <text x="368" y="205" font-size="10" fill="#666666">similaridade</text>
  <line x1="352" y1="190" x2="308" y2="190" stroke="#333333" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="448" y1="190" x2="492" y2="190" stroke="#333333" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Comparison table -->
  <rect x="32" y="330" width="736" height="150" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="350" font-size="11" font-weight="bold" fill="#333333">Proposição</text>
  <text x="440" y="350" font-size="11" font-weight="bold" fill="#333333">Voto A</text>
  <text x="560" y="350" font-size="11" font-weight="bold" fill="#333333">Voto B</text>
  <text x="680" y="350" font-size="11" font-weight="bold" fill="#333333">Convergiu?</text>
  <line x1="44" y1="360" x2="756" y2="360" stroke="#333333" stroke-width="1"/>

  <g font-size="10" fill="#999999">
    <line x1="44" y1="380" x2="420" y2="380" stroke="#dddddd" stroke-width="5"/>
    <text x="440" y="384">Sim</text><text x="560" y="384">Sim</text><text x="680" y="384">✔</text>

    <line x1="44" y1="404" x2="400" y2="404" stroke="#dddddd" stroke-width="5"/>
    <text x="440" y="408">Não</text><text x="560" y="408">Sim</text><text x="680" y="408">✘</text>

    <line x1="44" y1="428" x2="430" y2="428" stroke="#dddddd" stroke-width="5"/>
    <text x="440" y="432">Sim</text><text x="560" y="432">Sim</text><text x="680" y="432">✔</text>

    <line x1="44" y1="452" x2="390" y2="452" stroke="#dddddd" stroke-width="5"/>
    <text x="440" y="456">Abstenção</text><text x="560" y="456">Sim</text><text x="680" y="456">✘</text>
  </g>

  <line x1="0" y1="498" x2="800" y2="498" stroke="#333333" stroke-width="1"/>
  <text x="16" y="514" font-size="10" fill="#999999">Comparação calculada a partir do histórico de votações nominais (Câmara dos Deputados)</text>
</svg>
