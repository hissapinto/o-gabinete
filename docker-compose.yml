name: o-gabinete

services:
  database:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uso unico: roda o pipeline/carga.py e termina. Se o ano ja esta
  # carregado, sai na hora sem baixar nada; FORCAR_CARGA=1 recarrega.
  # Os CSVs ficam em dados/brutos/ da maquina, entao nao sao baixados de novo.
  carga:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      FORCAR_CARGA: ${FORCAR_CARGA:-0}
    volumes:
      - ./dados/brutos:/app/dados/brutos
    restart: "no"
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: ./web/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      # vazio: no compose o front chega pela mesma origem (proxy /api/ do nginx)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # --reload so no desenvolvimento; o Dockerfile (Render) roda sem ele
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./web/api:/app
    depends_on:
      carga:
        condition: service_completed_successfully

  frontend:
    build: ./web/frontend
    ports:
      - "8501:80"
    # So os arquivos da pagina: Dockerfile e nginx.conf nao viram estaticos.
    volumes:
      - ./web/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/frontend/css:/usr/share/nginx/html/css:ro
      - ./web/frontend/js:/usr/share/nginx/html/js:ro
    depends_on:
      - backend

volumes:
  postgres_data:
