# O Gabinete - Mapa de Similaridade Politica entre Deputados Federais
# Arquivo: docker-compose.yml
#
# Integrantes:
#     Caio Ariel Cardoso Saraiva  - RA 10439611
#     Isabela Hissa Pinto         - RA 10441873
#     Kaique Barros Paiva         - RA 10441787
#
# Sintese:
#     Orquestra a versao web em desenvolvimento: o banco PostgreSQL, um
#     servico de carga que roda uma vez e termina, a API em FastAPI e a
#     interface servida por nginx, que repassa /api/ para a API.
#
#     A ordem entre eles e garantida por depends_on com condicao: a carga so
#     comeca com o banco saudavel, e a API so sobe com a carga concluida.
#     Assim um "docker compose up" em maquina limpa entrega o grafo pronto.
#
#     Em producao esta composicao nao e usada: a API e a interface ficam no
#     Render e o banco no Neon, conforme docs/DEPLOY.md e render.yaml.
#
# Historico de alteracoes:
#     25/09/2026 - Caio - Criacao do ambiente conteinerizado (TG2).
#     10/10/2026 - Caio - Caminhos ajustados apos a reorganizacao por componente.
#     04/11/2026 - Caio - Servico de carga antes da API e interface em nginx.
#     04/11/2026 - Isabela - ANO_REFERENCIA repassado ao servico de carga, para
#                            carregar outros anos da legislatura.

name: o-gabinete

services:
  database:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Uso unico: roda o pipeline/carga.py e termina. Se o ano ja esta
  # carregado, sai na hora sem baixar nada; FORCAR_CARGA=1 recarrega.
  # Os CSVs ficam em dados/brutos/ da maquina, entao nao sao baixados de novo.
  carga:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      FORCAR_CARGA: ${FORCAR_CARGA:-0}
      ANO_REFERENCIA: ${ANO_REFERENCIA:-2024}
    volumes:
      - ./dados/brutos:/app/dados/brutos
    restart: "no"
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: ./web/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      # vazio: no compose o front chega pela mesma origem (proxy /api/ do nginx)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # --reload so no desenvolvimento; o Dockerfile (Render) roda sem ele
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./web/api:/app
    depends_on:
      carga:
        condition: service_completed_successfully

  frontend:
    build: ./web/frontend
    ports:
      - "8501:80"
    # So os arquivos da pagina: Dockerfile e nginx.conf nao viram estaticos.
    volumes:
      - ./web/frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/frontend/css:/usr/share/nginx/html/css:ro
      - ./web/frontend/js:/usr/share/nginx/html/js:ro
    depends_on:
      - backend

volumes:
  postgres_data:
