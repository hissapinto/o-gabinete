#
# Sintese:
#     Serve a interface (index.html, css/, js/) e repassa /api/ para o servico
#     backend do docker-compose.yml. Pagina e API ficam na mesma origem, entao
#     o navegador nao faz CORS e o js/dados.js nao conhece o endereco da API.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # A barra final do proxy_pass tira o prefixo: /api/anos -> backend /anos.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
        # Em desenvolvimento os arquivos vem de volume: o navegador revalida
        # a cada carga em vez de usar um modulo JS antigo do cache.
        add_header Cache-Control "no-cache";
    }
}
